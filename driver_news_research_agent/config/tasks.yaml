fetch_news_articles:
  description: >
    Search and fetch recent news articles about {driver_name} from multiple trusted F1 sources.
    Use the serper_news_search tool to systematically search these sources:
    - ESPN F1 (site:espn.com/f1)
    - Fox Sports (site:foxsports.com)
    - BBC Sport (site:bbc.com/sport)
    - Sky Sports F1 (site:skysports.com/f1)
    - Autosport (site:autosport.com)
    
    For each source, construct queries like "{driver_name} site:espn.com/f1" to get targeted results.
    Collect at least 5-10 diverse articles with complete information including titles, descriptions, sources, and publication dates.
    Focus on recent articles (last 7-14 days) when possible.
  expected_output: >
    A structured collection of news articles in JSON format containing:
    - Article title
    - Article description/snippet
    - Source name (ESPN F1, Fox Sports, BBC Sport, Sky Sports F1, Autosport)
    - Publication date
    - Minimum 5 articles from different sources when available
  agent: news_fetcher_agent

analyze_news_sentiment:
  description: >
    Analyze the news articles collected about {driver_name} to extract key insights, sentiment trends,
    and significant developments. Examine the overall narrative around the driver across different sources.
    
    Key analysis areas:
    - Overall sentiment (positive, neutral, negative) across articles
    - Major themes and storylines emerging in coverage
    - Differences in coverage between sources
    - Key quotes and significant developments
    - Performance-related news vs. personal/off-track coverage
    - Recent trends in media coverage
    
    Provide actionable insights that would be valuable for understanding the driver's current media presence.
  expected_output: >
    A comprehensive news analysis report containing:
    
    ## Overall Media Sentiment
    Summary of how {driver_name} is being portrayed across major F1 sources.
    
    ## Key Storylines
    Main themes and narratives appearing in recent coverage.
    
    ## Source Comparison
    How different outlets (ESPN, Fox Sports, BBC, Sky Sports, Autosport) are covering the driver.
    
    ## Significant Quotes & Developments
    Important statements, announcements, or developments mentioned in articles.
    
    ## Recent Performance Coverage
    Analysis of race-related vs. off-track coverage balance.
    
    ## Media Trends
    Notable patterns in recent coverage and potential implications.
    
    ## Summary
    Overall assessment of {driver_name}'s current media presence and public narrative.
  agent: news_analyzer_agent
