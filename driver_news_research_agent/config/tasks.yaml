fetch_news_articles:
  description: >
    Search and fetch recent news articles about {driver_name} from multiple trusted F1 sources.
    Use the serper_news_search tool to systematically search these sources:
    - ESPN F1 (site:espn.com/f1)
    - Fox Sports (site:foxsports.com)
    - BBC Sport (site:bbc.com/sport)
    - Sky Sports F1 (site:skysports.com/f1)
    - Autosport (site:autosport.com)
    
    For each source, construct queries like "{driver_name} site:espn.com/f1" to get targeted results.
    Collect at least 5-10 diverse articles with complete information including titles, descriptions, sources, and publication dates.
    Focus on recent articles (last 7-14 days) when possible.
  expected_output: >
    A structured collection of news articles in JSON format containing:
    - Article title
    - Article description/snippet
    - Source name (ESPN F1, Fox Sports, BBC Sport, Sky Sports F1, Autosport)
    - Publication date
    - Minimum 5 articles from different sources when available
  agent: news_fetcher_agent

analyze_news_sentiment:
  description: >
    Analyze the news articles collected about {driver_name} to extract key insights, sentiment trends,
    and significant developments. Select the 5 most relevant and recent articles from the fetched news.
    For each selected article, create a concise news summary and provide an overall analysis.
    
    Key analysis areas:
    - Select exactly 5 most relevant articles from the fetched news
    - Create concise news summaries for each selected article
    - Overall sentiment (positive, neutral, negative) across articles
    - Major themes and storylines emerging in coverage
    - Key developments and significant news about the driver
    - Overall media narrative and public perception
    
    Return the results in a structured JSON format with exactly 5 articles and a comprehensive summary.
  expected_output: >
    A structured JSON response containing exactly:
    
    1. "articles": An array of exactly 5 news articles, each containing:
       - "title": The original article title
       - "news": A concise 2-3 sentence summary of the article content
       - "source": The news source (ESPN F1, Fox Sports, BBC Sport, Sky Sports F1, or Autosport)
       - "published_at": Publication date as a string
    
    2. "total_summary": A comprehensive paragraph (3-5 sentences) summarizing:
       - Overall sentiment and narrative about {driver_name}
       - Key themes emerging from the coverage
       - Most significant developments or storylines
       - Current media perception and any notable trends
    
    Ensure the output is valid JSON that exactly matches this structure.
  agent: news_analyzer_agent
